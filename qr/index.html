<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Códigos QR · Atlas UACh</title>
    <link rel="stylesheet" href="../css/atlas.css" />
  </head>
  <body>
    <div class="page-head">
      <div class="wrap">
        <a href="../">← Atlas de surgencia</a>
        <h1>Códigos QR</h1>
        <p>
          SVG vectorial y PNG de alta resolución para imprimir con un margen
          blanco de cuatro módulos.
        </p>
      </div>
    </div>
    <main class="wrap section cards two">
      <article class="card">
        <h2>Atlas oceanográfico</h2>
        <img src="atlas-lofa.svg" width="210" alt="QR del atlas" />
        <p>
          Negro sobre blanco · <a download href="atlas-negro.svg">SVG</a> ·
          <a download href="atlas-negro.png">PNG</a>
        </p>
        <p>
          Identidad LOFA · <a download href="atlas-lofa.svg">SVG</a> ·
          <a download href="atlas-lofa.png">PNG</a>
        </p>
      </article>
      <article class="card">
        <h2>Biblioteca científica</h2>
        <img
          src="bibliografia-lofa.svg"
          width="210"
          alt="QR de la biblioteca científica"
        />
        <p>
          Negro sobre blanco ·
          <a download href="bibliografia-negro.svg">SVG</a> ·
          <a download href="bibliografia-negro.png">PNG</a>
        </p>
        <p>
          Identidad LOFA · <a download href="bibliografia-lofa.svg">SVG</a> ·
          <a download href="bibliografia-lofa.png">PNG</a>
        </p>
      </article>
    </main>
  </body>
</html>
